[package]
name = "cloud-sg-sync"
version = "1.0.0"
description = "Cloud security group IP sync (Aliyun first)"
authors = ["zhangyanfeng2015"]
license = "MIT"
repository = "https://github.com/zhangyanfeng2015/cloud-sg-sync"
edition = "2021"

[lib]
name = "cloud_sg_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = { version = "0.22", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
